[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-wasm"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests -q"
serve = "python -m mojowasm serve"
bench = "python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092605"
python = "3.13.*"
pytest = "*"
lld = "*"
clang = ">=20"
